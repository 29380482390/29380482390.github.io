<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#181818">
  <meta name="description" content="A quiet place for your bookmarks.">
  <title>startpage</title>
  <link rel="icon" href="./assets/minimal/favicon.svg?v=9a0454c58a" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/minimal/styles.css?v=291e5ec03d">
  <script defer src="./assets/minimal/bookmarks.js?v=abf431e24d"></script>
  <script defer src="./assets/minimal/core.js?v=07e4403299"></script>
  <script defer src="./assets/minimal/app.js?v=fb27391876"></script>
</head>
<body>
  <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>
  <main id="home" class="home">
    <h1 class="sr-only">startpage</h1>
    <form id="search-form" class="search-form" role="search" autocomplete="off">
      <label class="sr-only" for="query">bookmark key, address or search</label>
      <input id="query" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    </form>
    <nav id="bookmarks" class="bookmarks" aria-label="bookmarks"></nav>
    <p id="search-status" class="sr-only" role="status"></p>
  </main>

  <button id="open-settings" class="icon-button settings-toggle" type="button" aria-label="settings" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5m4 0h7M4 17h9m4 0h3"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg>
  </button>

  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <button id="close-settings" class="icon-button panel-return" type="button" aria-label="close settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    <form id="settings-form" autocomplete="off">
      <header class="settings-header">
        <h2 id="settings-title">settings</h2>
      </header>
      <div class="settings-content">
        <label class="field-label" for="engine">search engine</label>
        <div class="select-wrap">
          <select id="engine" name="engine">
            <option value="google">google (no ai)</option>
            <option value="duckduckgo">duckduckgo</option>
            <option value="startpage">startpage</option>
            <option value="custom">custom</option>
          </select>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </div>
        <div id="custom-engine" class="custom-engine" aria-hidden="true" inert>
          <div class="custom-engine-content">
            <label class="field-label" for="custom-search-url">search address</label>
            <input id="custom-search-url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" maxlength="2000" placeholder="https://example.com/search?q={query}" disabled aria-describedby="custom-engine-hint">
            <p id="custom-engine-hint" class="settings-hint">use {query} where the search phrase should go.</p>
          </div>
        </div>
        <section class="background-settings" aria-labelledby="background-title">
          <h3 id="background-title">background</h3>
          <label class="sr-only" for="background-mode">background type</label>
          <div class="select-wrap">
            <select id="background-mode">
              <option value="random">random photo on refresh</option>
              <option value="image">image address</option>
              <option value="color">solid color</option>
            </select>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          </div>
          <div id="background-image-field" class="background-option" hidden>
            <label class="field-label" for="background-url">image address</label>
            <input id="background-url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" maxlength="2000" placeholder="https://example.com/photo.jpg">
          </div>
          <div id="background-color-field" class="background-option" hidden>
            <label class="field-label" for="background-color">color</label>
            <input id="background-color" type="color" value="#181818">
          </div>
          <div id="background-photo-controls" class="background-photo-controls">
            <div class="range-field">
              <label for="background-blur">blur</label><output id="background-blur-value" for="background-blur">20 px</output>
              <input id="background-blur" type="range" min="0" max="40" value="20">
            </div>
            <div class="range-field">
              <label for="background-darkness">darkness</label><output id="background-darkness-value" for="background-darkness">58%</output>
              <input id="background-darkness" type="range" min="0" max="90" value="58">
            </div>
          </div>
          <div id="background-random-controls" class="background-option">
            <button id="new-background" class="text-button" type="button"><span aria-hidden="true">↻</span> new photo</button>
            <a class="photo-credit" href="https://picsum.photos/" target="_blank" rel="noopener noreferrer">photos by lorem picsum</a>
          </div>
          <p id="background-status" class="settings-hint" role="status"></p>
        </section>
        <div class="bookmarks-heading"><h3>bookmarks</h3></div>
        <div class="editor-labels" aria-hidden="true">
          <div class="editor-label-group"><span>key</span><span>name / address</span></div>
          <div class="editor-label-group"><span>key</span><span>name / address</span></div>
        </div>
        <div id="bookmark-editor" class="bookmark-editor"></div>
        <div class="add-bookmark-float"><button id="add-bookmark" type="button" class="text-button"><span aria-hidden="true">+</span> add bookmarks</button></div>
      </div>
      <p id="settings-error" class="settings-error" role="alert"></p>
    </form>
  </dialog>
  <noscript><p class="noscript">enable javascript to use this startpage.</p></noscript>
</body>
</html>
